name: Deploy Website

on:
  push:
    branches:
      - main  # Trigger on pushes to the main branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Replace CV Link Placeholder
        env:
            CV_Link:${{ secrets.CV_Link }}
            likdin_link:${{ secrets.likdin_link }}
            Link_github:${{ secrets.Link_github }}
            Email:${{ secrets.Email }}  

        run: |
          sed -i "s|CV_Link_placeholder|$CV_Link|g" about.html
          sed -i "s|Likdin_link_placeholder|$Likdin_link|g" about.html
          sed -i "s|Github_link_placeholder|$Link_github|g" about.html
          sed -i "s|Email_placeholder|$email|g" about.html

      - name: Build and Deploy
        run: |
          echo "Deploying the website..."